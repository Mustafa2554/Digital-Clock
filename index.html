<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>

  <body>

    <div class="container">

      <div class="clock">
        <div id="hours">
          <h4>Hours</h4>
          <span>00</span>
        </div>

        <div id="minutes">
          <h4>Minutes</h4>
          <span>00</span>
        </div>

        <div id="seconds">
          <h4>Seconds</h4>
          <span>00</span>
        </div>

        <div class="period">
          <h5>PM</h5>
        </div>
      </div>

      <div class="date">
        <h3>October 10, 2023</h3>
        <h5>Monday</h5>
      </div>
    </div>

  </body>
</html>
